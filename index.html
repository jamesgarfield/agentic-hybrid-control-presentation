<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Agentic Patterns and Hybrid Mechanisms of Control</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/night.css">
		<link rel="stylesheet" href="css/custom.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- Use external markdown resource, separate slides by three newlines; vertical slides by two newlines -->
				<section data-markdown="slides/main.md" 
					data-separator="^\r?\n---\r?\n$" 
					data-separator-vertical="^^\r?\n--\r?\n$" 
					data-separator-notes="^Note:">
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script src="plugin/math/math.js"></script>
		
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,
				slideNumber: true,
				transition: 'slide',
				controls: true,
				progress: true,
				center: true,
				
				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX ]
			});
		</script>
	<!-- Header/footer elements for both presentation and print-pdf modes -->
	<style type="text/css">
		#footer-left {
			position: absolute;
			bottom: 10px;
			left: 10px;
		}
		#footer-left img {
			width: 180px;
			height: auto;
			background: none !important;
			box-shadow: none !important;
			padding: 0 !important;
			border-radius: 0 !important;
		}
	</style>

	<!-- Hidden elements that will be cloned to each slide -->
	<div id="hidden" style="display:none;">
		<div id="footer-left">
			<img src="/images/enfi-white-logo.png" alt="EnFi Logo">
		</div>
	</div>

	<script>
		// Wait for Reveal to be fully loaded
		Reveal.addEventListener('ready', function() {
			var footerContent = document.getElementById('footer-left');
			
			// For PDF export
			if (window.location.search.match(/print-pdf/gi)) {
				// Add to each slide background
				document.querySelectorAll('.slide-background').forEach(function(slide) {
					var clone = footerContent.cloneNode(true);
					slide.appendChild(clone);
				});
			} else {
				// For regular presentation mode, add the logo to the main reveal container
				var clone = footerContent.cloneNode(true);
				clone.style.position = 'fixed'; // Fixed positioning for normal presentation
				clone.style.zIndex = '100';     // Keep above other elements
				document.querySelector('.reveal').appendChild(clone);
			}
		});
	</script>
	</body>
</html>
